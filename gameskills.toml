# Project-owned choices. Core-only adoption is the distribution default.
schema_version = 1
packages = ["gameskills", "gameskills-ui", "gameskills-turn-based", "gameskills-multiplayer", "gameskills-maintainer", "gameskills-linear"]
clients = ["codex", "claude"]

[project]
name = "Bevy Experiments"
delivery_target = "merge"
# Feature merges into dev are explicitly authorized after checks and review.
# Main promotions require separate user authorization.
delivery_base = "main"

[creative]
default_level = 2

[verification]
default_level = "development"
manual_sanity = "milestone"

[verification.branches]
dev = "development"
main = "testing"

[verification.display]
width = 1920
height = 1080
scale = "auto"

[verification.levels.development]
platforms = ["macos"]

[verification.levels.testing]
platforms = ["macos"]

[verification.levels.release]
platforms = ["macos", "linux", "windows"]

[dispatch]
# Owner approved parallel implementation with at most five workers.
enabled = true
max_workers = 5

[targets.labyrinth]
path = "games/labyrinth"
packages = ["gameskills-ui", "gameskills-turn-based", "gameskills-multiplayer"]

[targets.deckbuilder]
path = "games/deckbuilder"
packages = ["gameskills-ui", "gameskills-multiplayer"]

[targets.carterfight]
path = "games/carterfight"
packages = ["gameskills-ui"]

[targets.gamekit]
path = "gamekit"
packages = ["gameskills-maintainer"]

