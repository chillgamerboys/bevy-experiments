# Project-owned choices. Core-only adoption is the distribution default.
schema_version = 1
packages = ["gameskills", "gameskills-ui", "gameskills-turn-based", "gameskills-multiplayer", "gameskills-maintainer"]
clients = ["codex", "claude"]

[project]
name = "Bevy Experiments"
delivery_target = "pr"

[creative]
default_level = 2

[dispatch]
# Owner approved parallel implementation with at most five workers.
enabled = true
max_workers = 5

[targets.labyrinth]
path = "games/labyrinth"
packages = ["gameskills-ui", "gameskills-turn-based", "gameskills-multiplayer"]

[targets.deckbuilder]
path = "games/deckbuilder_ui"
packages = ["gameskills-ui", "gameskills-multiplayer"]

[targets.carterfight]
path = "games/carterfight"
packages = ["gameskills-ui"]

[targets.gamekit]
path = "crates"
packages = ["gameskills-maintainer"]

[commands.repo-check]
argv = ["cargo", "run", "--locked", "-p", "gamekit-repo-tools", "--profile", "ci", "--", "check"]
timeout_seconds = 600
resources = ["project:cargo-target"]

[commands.skills-validate]
argv = ["cargo", "run", "--locked", "-p", "gamekit-repo-tools", "--profile", "ci", "--", "skills", "validate"]
timeout_seconds = 600
resources = ["project:cargo-target"]

[commands.legacy-skills-validate]
argv = ["cargo", "run", "--locked", "-p", "gamekit-repo-tools", "--profile", "ci", "--", "skills", "legacy"]
timeout_seconds = 600
resources = ["project:cargo-target"]

[commands.distribution-check]
argv = ["cargo", "run", "--locked", "-p", "gamekit-repo-tools", "--profile", "ci", "--", "distribution", "check"]
timeout_seconds = 1800
resources = ["project:cargo-target"]

[commands.skills-test]
argv = ["python3", "-m", "unittest", "discover", "-s", "skills/tests", "-v"]
timeout_seconds = 600
resources = ["project:skills-tests"]
requires = ["skills-validate"]

[commands.repo-test]
argv = ["cargo", "test", "--locked", "-p", "gamekit-repo-tools", "--profile", "ci", "--test", "ci_routing", "--test", "ci_checks", "--test", "ci_cli"]
timeout_seconds = 600
resources = ["project:cargo-target"]

[commands.rust-format]
argv = ["cargo", "fmt", "--all", "--", "--check"]
timeout_seconds = 120

[commands.tooling-test]
argv = ["cargo", "test", "--locked", "-p", "gameskills-cli", "-p", "gamekit-repo-tools", "--profile", "ci"]
timeout_seconds = 600
resources = ["project:cargo-target"]

[commands.migration-contracts]
argv = ["cargo", "run", "--locked", "-p", "gamekit-repo-tools", "--profile", "ci", "--", "contracts", "check", "--verify-reference"]
timeout_seconds = 600
resources = ["project:cargo-target"]

[commands.tooling-lint]
argv = ["cargo", "clippy", "--locked", "-p", "gameskills-cli", "-p", "gamekit-repo-tools", "--all-targets", "--profile", "ci", "--", "-D", "warnings"]
timeout_seconds = 600
resources = ["project:cargo-target"]

[commands.ui-test]
argv = ["cargo", "test", "-p", "bevy_game_ui", "--profile", "ci"]
timeout_seconds = 1200
resources = ["project:cargo-target"]

[commands.rules-test]
argv = ["cargo", "test", "-p", "labyrinth_rules", "--profile", "ci"]
timeout_seconds = 1200
resources = ["project:cargo-target"]

[commands.bundle-check]
argv = ["cargo", "run", "--locked", "-p", "gamekit-repo-tools", "--profile", "ci", "--", "bundle", "check"]
timeout_seconds = 600
resources = ["project:cargo-target"]

[commands.distribution-archives]
argv = ["cargo", "run", "--locked", "-p", "gamekit-repo-tools", "--profile", "ci", "--", "distribution", "archives"]
timeout_seconds = 1800
resources = ["project:cargo-target"]

[commands.cli-package]
argv = ["cargo", "package", "--locked", "-p", "gameskills-cli"]
timeout_seconds = 900
resources = ["project:cargo-target"]

[commands.bundle-package-check]
argv = ["cargo", "run", "--locked", "-p", "gamekit-repo-tools", "--profile", "ci", "--", "bundle", "verify-package"]
timeout_seconds = 600
resources = ["project:cargo-target"]
requires = ["cli-package", "bundle-check"]
