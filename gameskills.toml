# Opted-in host mappings. Resolve against actual available host capabilities.
[agents.routing]
default_tier = "small"
escalation_after_failures = 1
max_attempts = 2

[agents.routing.clients.codex.small]
model = "gpt-5.6-luna"
effort = "medium"

[agents.routing.clients.codex.standard]
model = "gpt-5.6-sol"
effort = "medium"

[agents.routing.clients.codex.strong]
model = "gpt-6-astra"
effort = "high"

