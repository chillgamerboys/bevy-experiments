# Project-owned choices. Core-only adoption is the distribution default.
schema_version = 1
packages = ["gameskills", "gameskills-ui", "gameskills-turn-based", "gameskills-multiplayer", "gameskills-maintainer", "gameskills-linear"]
clients = ["codex", "claude"]

[project]
name = "Bevy Experiments"
delivery_target = "pr"

[creative]
default_level = 2

[dispatch]
# Owner approved parallel implementation with at most five workers.
enabled = true
max_workers = 5

[targets.labyrinth]
path = "games/labyrinth"
packages = ["gameskills-ui", "gameskills-turn-based", "gameskills-multiplayer"]

[targets.deckbuilder]
path = "games/deckbuilder"
packages = ["gameskills-ui", "gameskills-multiplayer"]

[targets.carterfight]
path = "games/carterfight"
packages = ["gameskills-ui"]

[targets.gamekit]
path = "gamekit"
packages = ["gameskills-maintainer"]

[commands.repo-check]
argv = ["cargo", "run", "--locked", "-p", "repo-devtools", "--profile", "ci", "--", "check"]
timeout_seconds = 600
resources = ["project:cargo-target"]

[commands.skills-validate]
argv = ["cargo", "run", "--locked", "-p", "repo-devtools", "--profile", "ci", "--", "skills", "validate"]
timeout_seconds = 600
resources = ["project:cargo-target"]

[commands.legacy-skills-validate]
argv = ["cargo", "run", "--locked", "-p", "repo-devtools", "--profile", "ci", "--", "skills", "legacy"]
timeout_seconds = 600
resources = ["project:cargo-target"]

[commands.distribution-check]
argv = ["cargo", "run", "--locked", "-p", "repo-devtools", "--profile", "ci", "--", "distribution", "check"]
timeout_seconds = 1800
resources = ["project:cargo-target"]

[commands.skills-test]
argv = ["cargo", "test", "--locked", "-p", "gameskills-cli", "-p", "gameskills-linear", "--profile", "ci"]
timeout_seconds = 600
resources = ["project:cargo-target"]
requires = ["skills-validate"]

[commands.repo-test]
argv = ["cargo", "test", "--locked", "-p", "repo-devtools", "--profile", "ci", "--test", "ci_routing", "--test", "ci_checks", "--test", "ci_cli"]
timeout_seconds = 600
resources = ["project:cargo-target"]

[commands.rust-format]
argv = ["cargo", "fmt", "--all", "--", "--check"]
timeout_seconds = 120

[commands.tooling-test]
argv = ["cargo", "test", "--locked", "-p", "gameskills-cli", "-p", "gameskills-linear", "-p", "repo-devtools", "--profile", "ci"]
timeout_seconds = 600
resources = ["project:cargo-target"]

[commands.migration-contracts]
argv = ["cargo", "run", "--locked", "-p", "repo-devtools", "--profile", "ci", "--", "contracts", "check", "--verify-reference", "--cutover"]
timeout_seconds = 600
resources = ["project:cargo-target"]

[commands.tooling-lint]
argv = ["cargo", "clippy", "--locked", "-p", "gameskills-cli", "-p", "gameskills-linear", "-p", "repo-devtools", "--all-targets", "--profile", "ci", "--", "-D", "warnings"]
timeout_seconds = 600
resources = ["project:cargo-target"]

[commands.ui-test]
argv = ["cargo", "test", "-p", "bevy-gamekit-ui", "--profile", "ci"]
timeout_seconds = 1200
resources = ["project:cargo-target"]

[commands.rules-test]
argv = ["cargo", "test", "-p", "labyrinth-rules", "--profile", "ci"]
timeout_seconds = 1200
resources = ["project:cargo-target"]

[commands.labyrinth-test]
argv = ["cargo", "test", "--locked", "-p", "labyrinth", "--profile", "ci", "--", "--nocapture"]
timeout_seconds = 1200
resources = ["project:cargo-target"]
requires = ["rules-test"]

[commands.labyrinth-lint]
argv = ["cargo", "clippy", "--locked", "-p", "labyrinth", "-p", "labyrinth-rules", "--all-targets", "--profile", "ci", "--", "-D", "warnings"]
timeout_seconds = 1200
resources = ["project:cargo-target"]

[commands.labyrinth-movement-test]
argv = ["cargo", "test", "--locked", "-p", "labyrinth", "--profile", "ci", "--lib", "ui::tests::movement", "--", "--nocapture", "--test-threads=1"]
timeout_seconds = 600
resources = ["project:cargo-target"]

[commands.labyrinth-build]
argv = ["cargo", "build", "--locked", "-p", "labyrinth", "--bin", "labyrinth", "--profile", "ci"]
timeout_seconds = 1200
resources = ["project:cargo-target"]

[commands.labyrinth-render-movement]
argv = ["cargo", "run", "--locked", "-p", "labyrinth", "--example", "labyrinth_review", "--profile", "ci", "--", "target/review/labyrinth-movement-1280.png", "1280", "720", "auto", "movement"]
timeout_seconds = 600
resources = ["project:cargo-target", "gpu", "window"]

[commands.labyrinth-render-movement-large-text]
argv = ["cargo", "run", "--locked", "-p", "labyrinth", "--example", "labyrinth_review", "--profile", "ci", "--", "target/review/labyrinth-movement-200.png", "1280", "720", "200", "movement"]
timeout_seconds = 600
resources = ["project:cargo-target", "gpu", "window"]

[commands.labyrinth-render-movement-wide]
argv = ["cargo", "run", "--locked", "-p", "labyrinth", "--example", "labyrinth_review", "--profile", "ci", "--", "target/review/labyrinth-movement-1920.png", "1920", "1080", "auto", "movement"]
timeout_seconds = 600
resources = ["project:cargo-target", "gpu", "window"]

[commands.labyrinth-render-movement-blocked]
argv = ["cargo", "run", "--locked", "-p", "labyrinth", "--example", "labyrinth_review", "--profile", "ci", "--", "target/review/labyrinth-movement-blocked-1280.png", "1280", "720", "auto", "movement-blocked"]
timeout_seconds = 600
resources = ["project:cargo-target", "gpu", "window"]

[commands.bundle-check]
argv = ["cargo", "run", "--locked", "-p", "repo-devtools", "--profile", "ci", "--", "bundle", "check"]
timeout_seconds = 600
resources = ["project:cargo-target"]

[commands.distribution-archives]
argv = ["cargo", "run", "--locked", "-p", "repo-devtools", "--profile", "ci", "--", "distribution", "archives"]
timeout_seconds = 1800
resources = ["project:cargo-target"]

[commands.cli-package]
argv = ["cargo", "package", "--locked", "-p", "gameskills-cli"]
timeout_seconds = 900
resources = ["project:cargo-target"]

[commands.bundle-package-check]
argv = ["cargo", "run", "--locked", "-p", "repo-devtools", "--profile", "ci", "--", "bundle", "verify-package"]
timeout_seconds = 600
resources = ["project:cargo-target"]
requires = ["cli-package", "bundle-check"]

[commands.linear-package]
argv = ["cargo", "package", "--locked", "-p", "gameskills-linear"]
timeout_seconds = 900
resources = ["project:cargo-target"]

# Explicit repository opt-in; the helper receives no credentials from core.
[tracking]
required = true
observer = ["gameskills-linear", "observe", "--config", "gameskills-linear.toml"]


[docs]
index = "docs/README.md"
plans = "docs/plans"

[targets.labyrinth.docs]
index = "games/labyrinth/README.md"
plans = "games/labyrinth/docs/plans"

[targets.gamekit.docs]
index = "gamekit/docs/README.md"
plans = "gamekit/docs/plans"

[targets.gameskills]
path = "gameskills"

[targets.gameskills.docs]
index = "gameskills/docs/README.md"
plans = "gameskills/docs/plans"

[targets.devtools]
path = "devtools"

[targets.devtools.docs]
index = "devtools/README.md"

[commands.docs-check]
argv = ["cargo", "run", "--locked", "-p", "repo-devtools", "--profile", "ci", "--", "check"]
timeout_seconds = 600
resources = ["project:cargo-target"]
