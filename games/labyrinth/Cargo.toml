[package]
name = "labyrinth"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
autoexamples = false

[[example]]
name = "labyrinth_review"
path = "examples/review_capture.rs"

[dependencies]
aeronet = { version = "=0.21.0", default-features = false, features = ["std"] }
bevy = { workspace = true, features = ["ui", "system_clipboard", "png"] }
bevy_game_discovery = { workspace = true, features = ["mdns", "tailscale-cli"] }
bevy_game_multiplayer = { workspace = true, features = ["direct"] }
bevy_game_session.workspace = true
bevy_game_ui.workspace = true
bevy_replicon = { version = "=0.41.1", default-features = false, features = ["client", "server"] }
directories = "6"
labyrinth_rules = { path = "rules" }
serde.workspace = true
serde_json = "1"
sha2 = "0.10"
zeroize = "1"

[dev-dependencies]
bevy_game_test = { workspace = true, features = ["ui"] }
tempfile = "3"

[lints]
workspace = true
