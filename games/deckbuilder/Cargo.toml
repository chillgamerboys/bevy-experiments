[package]
name = "deckbuilder"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
aeronet = { version = "=0.21.0", default-features = false, features = ["std"] }
bevy = { workspace = true, features = ["ui", "system_clipboard", "png"] }
bevy-gamekit = { workspace = true, features = ["ui", "turns", "direct", "mdns", "tailscale-cli"] }
bevy_replicon = { version = "=0.41.1", default-features = false, features = ["client", "server"] }
directories = "6"
serde.workspace = true
zeroize = "1"

[dev-dependencies]
bevy-gamekit = { workspace = true, features = ["testing-ui"] }
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
