name: Gamekit

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python scripts/check_repo.py
      - run: python -m unittest discover -s scripts/tests -v
      - run: python skills/scripts/validate_skills.py
      - run: python -m unittest discover -s skills/tests -v
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux window-system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libudev-dev libwayland-dev libxkbcommon-dev libasound2-dev
        working-directory: .
      - uses: Swatinem/rust-cache@v2
      - name: Verify library-only external consumers
        run: python scripts/check_distribution.py
      - run: cargo test --workspace --all-features --profile ci
      - name: Labyrinth six-process abrupt guest restart
        run: cargo test -p labyrinth --lib network::tests::process::six_native_processes_survive_guest_kill_and_finish_the_fight --profile ci -- --ignored --exact --nocapture
      - run: cargo test --workspace --doc --all-features --profile ci

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install Linux window-system dependencies
        run: sudo apt-get update && sudo apt-get install --yes libudev-dev libwayland-dev libxkbcommon-dev libasound2-dev
        working-directory: .
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: rustfmt --check --edition 2021 scripts/fixtures/gamekit_consumer.rs
      - run: cargo clippy --workspace --all-targets --all-features --profile ci -- -D warnings
      - run: cargo install cargo-deny --locked
      - run: cargo deny check
      - name: Check minimal capability graphs independently
        run: |
          cargo check -p bevy_game_discovery --no-default-features
          cargo check -p bevy_game_multiplayer --no-default-features
          cargo test -p bevy_game_test --no-default-features --profile ci
          cargo test -p bevy_game_ui --profile ci
      - name: Check browser-compatible core and UI (not native networking)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p bevy_game_hex -p bevy_game_turns -p bevy_game_session -p bevy_game_ui -p labyrinth_rules --target wasm32-unknown-unknown
