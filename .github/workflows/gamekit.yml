name: Gamekit

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: gamekit-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      selection: ${{ steps.scope.outputs.selection }}
      skills: ${{ steps.scope.outputs.skills }}
      rust: ${{ steps.scope.outputs.rust }}
      policy: ${{ steps.scope.outputs.policy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
      - uses: Swatinem/rust-cache@v2
        with:
          key: repository-validation
      - run: cargo run --locked -p repo-devtools --profile ci -- check
      - name: Verify CI routing, selected commands and final-gate failure contracts
        run: cargo test --locked -p repo-devtools --profile ci --test ci_routing --test ci_checks --test ci_cli
      - id: scope
        run: cargo run --locked -p repo-devtools --profile ci -- ci select

  skills:
    needs: classify
    if: needs.classify.outputs.skills == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CI_SELECTION: ${{ needs.classify.outputs.selection }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
      - uses: Swatinem/rust-cache@v2
        with:
          key: repository-validation
      - run: cargo run --locked -p repo-devtools --profile ci --target-dir target/ci-controller -- ci run skills

  rust:
    needs: classify
    if: needs.classify.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CI_SELECTION: ${{ needs.classify.outputs.selection }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
      - name: Install Linux window-system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libudev-dev libwayland-dev libxkbcommon-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - name: Verify migration accounting against the accepted source
        if: fromJSON(needs.classify.outputs.selection).full || contains(fromJSON(needs.classify.outputs.selection).packages, 'repo-devtools')
        run: cargo run --locked -p repo-devtools --profile ci -- contracts check --verify-reference --cutover
      - name: Verify the standalone CLI Cargo package
        if: fromJSON(needs.classify.outputs.selection).full || contains(fromJSON(needs.classify.outputs.selection).packages, 'gameskills-cli')
        run: cargo package --locked -p gameskills-cli
      - name: Inspect the CLI archive's instruction payload
        if: fromJSON(needs.classify.outputs.selection).full || contains(fromJSON(needs.classify.outputs.selection).packages, 'gameskills-cli')
        run: cargo run --locked -p repo-devtools --profile ci -- bundle verify-package
      - name: Verify the optional Linear helper Cargo package
        if: fromJSON(needs.classify.outputs.selection).full || contains(fromJSON(needs.classify.outputs.selection).packages, 'gameskills-linear')
        run: cargo package --locked -p gameskills-linear
      - name: Verify the repository tool Cargo package
        if: fromJSON(needs.classify.outputs.selection).full || contains(fromJSON(needs.classify.outputs.selection).packages, 'repo-devtools')
        run: cargo package --locked -p repo-devtools
      - run: cargo run --locked -p repo-devtools --profile ci --target-dir target/ci-controller -- ci run rust

  policy:
    needs: classify
    if: needs.classify.outputs.policy == 'true'
    runs-on: ubuntu-latest
    env:
      CI_SELECTION: ${{ needs.classify.outputs.selection }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
          components: clippy,rustfmt
      - name: Install Linux window-system dependencies
        run: sudo apt-get update && sudo apt-get install --yes libudev-dev libwayland-dev libxkbcommon-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --locked -p repo-devtools --profile ci --target-dir target/ci-controller -- ci run policy

  ci:
    if: always()
    needs: [classify, skills, rust, policy]
    runs-on: ubuntu-latest
    env:
      CI_SELECTION: ${{ needs.classify.outputs.selection }}
      CI_NEEDS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
      - uses: Swatinem/rust-cache@v2
        with:
          key: repository-validation
      - name: Build the checked-out final gate and verify selected job results
        run: cargo run --locked -p repo-devtools --profile ci -- ci gate
