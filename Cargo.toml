[package]
name = "bevy-experiments"
version = "0.1.0"
edition = "2021"
default-run = "tactics"

[lib]
name = "bevy_experiments"
path = "src/lib.rs"

[[test]]
name = "tactics"
path = "tests/tactics/main.rs"

[[test]]
name = "carterfight"
path = "tests/carterfight/main.rs"

[dependencies]
bevy = "0.18"
rand = "0.8"
rand_chacha = "0.3"

# Optimize debug builds for better performance
# Bevy projects are notoriously slow in debug mode without these settings
[profile.dev]
opt-level = 1  # Basic optimization for dev builds

[profile.dev.package."*"]
opt-level = 3  # Full optimization for dependencies
