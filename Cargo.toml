[workspace]
resolver = "3"
members = ["crates/*", "games/*", "games/labyrinth/rules", "tools/gameskills-cli", "tools/gamekit-repo-tools"]
default-members = ["games/labyrinth"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bevy = { version = "0.19", default-features = false, features = ["std", "async_executor", "bevy_state"] }
bevy_gamekit = { package = "bevy-gamekit", path = "crates/bevy_gamekit", default-features = false }
bevy_game_hex = { path = "crates/bevy_game_hex" }
bevy_game_discovery = { path = "crates/bevy_game_discovery" }
bevy_game_multiplayer = { path = "crates/bevy_game_multiplayer" }
bevy_game_session = { path = "crates/bevy_game_session" }
bevy_game_test = { path = "crates/bevy_game_test" }
bevy_game_turns = { path = "crates/bevy_game_turns" }
bevy_game_ui = { path = "crates/bevy_game_ui" }
if-addrs = "=0.15.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "time"] }
clap = { version = "4.6.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tempfile = "3.27.0"
toml = { version = "1.1.6", default-features = false, features = ["std", "serde", "parse"] }
toml_edit = "0.25.13"
regex = "1.13.1"
proc-macro2 = "1.0.107"
syn = { version = "2.0.119", default-features = false, features = ["parsing", "printing"] }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
too_many_arguments = "allow"
type_complexity = "allow"
unimplemented = "deny"
unwrap_used = "deny"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.ci]
inherits = "dev"
opt-level = 0
debug = "line-tables-only"
codegen-units = 4

[profile.ci.package."*"]
opt-level = 0

[profile.release]
codegen-units = 1
lto = "thin"
debug = "line-tables-only"
