<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Bevy Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
        }
        body {
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            position: fixed !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;
        }
    </style>
</head>
<body>
    <canvas id="bevy"></canvas>
    <script type="module">
        import init from './game.js';
        await init();
    </script>
</body>
</html>
