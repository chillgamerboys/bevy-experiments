<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Bevy Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
        }
        body {
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            position: fixed !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;
        }
    </style>
</head>
<body>
    <canvas id="bevy"></canvas>
    <script>
      (function () {
        const audioContextList = [];
        const userInputEventNames = [
          'click', 'contextmenu', 'auxclick', 'dblclick',
          'mousedown', 'mouseup', 'pointerup', 'touchend', 'keydown', 'keyup',
        ];
        self.AudioContext = new Proxy(self.AudioContext, {
          construct(target, args) {
            const result = new target(...args);
            audioContextList.push(result);
            return result;
          },
        });
        function resumeAllContexts() {
          let count = 0;
          audioContextList.forEach(context => {
            if (context.state !== 'running') context.resume();
            else count++;
          });
          if (count === audioContextList.length) {
            userInputEventNames.forEach(e => document.removeEventListener(e, resumeAllContexts));
          }
        }
        userInputEventNames.forEach(e => document.addEventListener(e, resumeAllContexts));
      })();
    </script>
    <script type="module">
        import init from './game.js';
        await init();
    </script>
</body>
</html>
