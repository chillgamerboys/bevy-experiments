[advisories]
ignore = [
    # Bevy 0.19's winit stack still reaches ttf-parser through sctk-adwaita.
    # The advisory has no safe upgrade; remove this when Bevy's graph moves.
    "RUSTSEC-2026-0192",
]

[bans]
multiple-versions = "warn"
# Workspace path dependencies intentionally have no registry version requirement.
wildcards = "allow"

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
